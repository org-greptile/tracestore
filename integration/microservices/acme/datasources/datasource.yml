apiVersion: 1

deleteDatasources:
  - name: Prometheus
  - name: Tracestore

datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  orgId: 1
  url: http://prometheus:9090
  basicAuth: false
  isDefault: false
  version: 1
  editable: false
- name: Tracestore
  type: tracestore
  access: proxy
  orgId: 1
  url: http://tracestore-query:16686
  basicAuth: false
  isDefault: false
  version: 1
  editable: false
  apiVersion: 1
  uid: tracestore
- name: Logstore
  type: logstore
  access: proxy
  orgId: 1
  url: http://logstore:3100
  basicAuth: false
  isDefault: false
  version: 1
  editable: false
  apiVersion: 1
  jsonData:
    derivedFields:
      - datasourceUid: tracestore
        matcherRegex: (?:traceID|trace_id)=(\w+)
        name: TraceID
        url: $${__value.raw}