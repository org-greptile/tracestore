"groups":
- "name": "tracestore_rules"
  "rules":
  - "expr": "histogram_quantile(0.99, sum(rate(tracestore_request_duration_seconds_bucket[1m])) by (le, cluster, namespace, job, route))"
    "record": "cluster_namespace_job_route:tracestore_request_duration_seconds:99quantile"
  - "expr": "histogram_quantile(0.50, sum(rate(tracestore_request_duration_seconds_bucket[1m])) by (le, cluster, namespace, job, route))"
    "record": "cluster_namespace_job_route:tracestore_request_duration_seconds:50quantile"
  - "expr": "sum(rate(tracestore_request_duration_seconds_sum[1m])) by (cluster, namespace, job, route) / sum(rate(tracestore_request_duration_seconds_count[1m])) by (cluster, namespace, job, route)"
    "record": "cluster_namespace_job_route:tracestore_request_duration_seconds:avg"
  - "expr": "sum(rate(tracestore_request_duration_seconds_bucket[1m])) by (le, cluster, namespace, job, route)"
    "record": "cluster_namespace_job_route:tracestore_request_duration_seconds_bucket:sum_rate"
  - "expr": "sum(rate(tracestore_request_duration_seconds_sum[1m])) by (cluster, namespace, job, route)"
    "record": "cluster_namespace_job_route:tracestore_request_duration_seconds_sum:sum_rate"
  - "expr": "sum(rate(tracestore_request_duration_seconds_count[1m])) by (cluster, namespace, job, route)"
    "record": "cluster_namespace_job_route:tracestore_request_duration_seconds_count:sum_rate"
