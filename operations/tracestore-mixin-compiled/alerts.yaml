"groups":
- "name": "tracestore_alerts"
  "rules":
  - "alert": "TracestoreCompactorUnhealthy"
    "annotations":
      "message": "There are {{ printf \"%f\" $value }} unhealthy compactor(s)."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreCompactorUnhealthy"
    "expr": |
      max by (cluster, namespace) (tracestore_ring_members{state="Unhealthy", name="compactor", namespace=~".*"}) > 0
    "for": "15m"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreDistributorUnhealthy"
    "annotations":
      "message": "There are {{ printf \"%f\" $value }} unhealthy distributor(s)."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreDistributorUnhealthy"
    "expr": |
      max by (cluster, namespace) (tracestore_ring_members{state="Unhealthy", name="distributor", namespace=~".*"}) > 0
    "for": "15m"
    "labels":
      "severity": "warning"
  - "alert": "TracestoreIngesterUnhealthy"
    "annotations":
      "message": "There are {{ printf \"%f\" $value }} unhealthy ingester(s)."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreIngesterUnhealthy"
    "expr": |
      max by (cluster, namespace) (tracestore_ring_members{state="Unhealthy", name="ingester", namespace=~".*"}) > 0
    "for": "15m"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreMetricsGeneratorUnhealthy"
    "annotations":
      "message": "There are {{ printf \"%f\" $value }} unhealthy metric-generator(s)."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreMetricsGeneratorUnhealthy"
    "expr": |
      max by (cluster, namespace) (tracestore_ring_members{state="Unhealthy", name="metrics-generator", namespace=~".*"}) > 0
    "for": "15m"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreCompactionsFailing"
    "annotations":
      "message": "Greater than 2 compactions have failed in the past hour."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreCompactionsFailing"
    "expr": |
      sum by (cluster, namespace) (increase(tracestoredb_compaction_errors_total{}[1h])) > 2 and
      sum by (cluster, namespace) (increase(tracestoredb_compaction_errors_total{}[5m])) > 0
    "for": "1h"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreIngesterFlushesUnhealthy"
    "annotations":
      "message": "Greater than 2 flush retries have occurred in the past hour."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreIngesterFlushesFailing"
    "expr": |
      sum by (cluster, namespace) (increase(tracestore_ingester_failed_flushes_total{}[1h])) > 2 and
      sum by (cluster, namespace) (increase(tracestore_ingester_failed_flushes_total{}[5m])) > 0
    "for": "5m"
    "labels":
      "severity": "warning"
  - "alert": "TracestoreIngesterFlushesFailing"
    "annotations":
      "message": "Greater than 2 flush retries have failed in the past hour."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreIngesterFlushesFailing"
    "expr": |
      sum by (cluster, namespace) (increase(tracestore_ingester_flush_failed_retries_total{}[1h])) > 2 and
      sum by (cluster, namespace) (increase(tracestore_ingester_flush_failed_retries_total{}[5m])) > 0
    "for": "5m"
    "labels":
      "severity": "critical"
  - "alert": "TracestorePollsFailing"
    "annotations":
      "message": "Greater than 2 polls have failed in the past hour."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestorePollsFailing"
    "expr": |
      sum by (cluster, namespace) (increase(tracestoredb_blocklist_poll_errors_total{}[1h])) > 2 and
      sum by (cluster, namespace) (increase(tracestoredb_blocklist_poll_errors_total{}[5m])) > 0
    "labels":
      "severity": "critical"
  - "alert": "TracestoreTenantIndexFailures"
    "annotations":
      "message": "Greater than 2 tenant index failures in the past hour."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreTenantIndexFailures"
    "expr": |
      sum by (cluster, namespace) (increase(tracestoredb_blocklist_tenant_index_errors_total{}[1h])) > 2 and
      sum by (cluster, namespace) (increase(tracestoredb_blocklist_tenant_index_errors_total{}[5m])) > 0
    "labels":
      "severity": "critical"
  - "alert": "TracestoreNoTenantIndexBuilders"
    "annotations":
      "message": "No tenant index builders for tenant {{ $labels.tenant }}. Tenant index will quickly become stale."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreNoTenantIndexBuilders"
    "expr": |
      sum by (cluster, namespace, tenant) (tracestoredb_blocklist_tenant_index_builder{}) == 0 and
      max by (cluster, namespace) (tracestoredb_blocklist_length{}) > 0
    "for": "5m"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreTenantIndexTooOld"
    "annotations":
      "message": "Tenant index age is 600 seconds old for tenant {{ $labels.tenant }}."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreTenantIndexTooOld"
    "expr": |
      max by (cluster, namespace, tenant) (tracestoredb_blocklist_tenant_index_age_seconds{}) > 600
    "for": "5m"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreBlockListRisingQuickly"
    "annotations":
      "message": "Tracestore block list length is up 40 percent over the last 7 days.  Consider scaling compactors."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreBlockListRisingQuickly"
    "expr": |
      avg(tracestoredb_blocklist_length{namespace=~".*", container="compactor"}) / avg(tracestoredb_blocklist_length{namespace=~".*", container="compactor"} offset 7d) > 1.4
    "for": "15m"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreBadOverrides"
    "annotations":
      "message": "{{ $labels.job }} failed to reload overrides."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreBadOverrides"
    "expr": |
      sum(tracestore_runtime_config_last_reload_successful{namespace=~".*"} == 0) by (cluster, namespace, job)
    "for": "15m"
    "labels":
      "severity": "warning"
  - "alert": "TracestoreUserConfigurableOverridesReloadFailing"
    "annotations":
      "message": "Greater than 5 user-configurable overides reloads failed in the past hour."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreTenantIndexFailures"
    "expr": |
      sum by (cluster, namespace) (increase(tracestore_overrides_user_configurable_overrides_reload_failed_total{}[1h])) > 5 and
      sum by (cluster, namespace) (increase(tracestore_overrides_user_configurable_overrides_reload_failed_total{}[5m])) > 0
    "labels":
      "severity": "critical"
  - "alert": "TracestoreProvisioningTooManyWrites"
    "annotations":
      "message": "Ingesters in {{ $labels.cluster }}/{{ $labels.namespace }} are receiving more data/second than desired, add more ingesters."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreProvisioningTooManyWrites"
    "expr": |
      avg by (cluster, namespace) (rate(tracestore_ingester_bytes_received_total{job=~".+/ingester"}[5m])) / 1024 / 1024 > 30
    "for": "15m"
    "labels":
      "severity": "warning"
  - "alert": "TracestoreCompactorsTooManyOutstandingBlocks"
    "annotations":
      "message": "There are too many outstanding compaction blocks in {{ $labels.cluster }}/{{ $labels.namespace }} for tenant {{ $labels.tenant }}, increase compactor's CPU or add more compactors."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreCompactorsTooManyOutstandingBlocks"
    "expr": |
      sum by (cluster, namespace, tenant) (tracestoredb_compaction_outstanding_blocks{container="compactor", namespace=~".*"}) / ignoring(tenant) group_left count(tracestore_build_info{container="compactor", namespace=~".*"}) by (cluster, namespace) > 100
    "for": "6h"
    "labels":
      "severity": "warning"
  - "alert": "TracestoreCompactorsTooManyOutstandingBlocks"
    "annotations":
      "message": "There are too many outstanding compaction blocks in {{ $labels.cluster }}/{{ $labels.namespace }} for tenant {{ $labels.tenant }}, increase compactor's CPU or add more compactors."
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreCompactorsTooManyOutstandingBlocks"
    "expr": |
      sum by (cluster, namespace, tenant) (tracestoredb_compaction_outstanding_blocks{container="compactor", namespace=~".*"}) / ignoring(tenant) group_left count(tracestore_build_info{container="compactor", namespace=~".*"}) by (cluster, namespace) > 250
    "for": "24h"
    "labels":
      "severity": "critical"
  - "alert": "TracestoreIngesterReplayErrors"
    "annotations":
      "message": "Tracestore ingester has encountered errors while replaying a block on startup in {{ $labels.cluster }}/{{ $labels.namespace }} for tenant {{ $labels.tenant }}"
      "runbook_url": "https://example.com/acme/tracestore/tree/main/operations/tracestore-mixin/runbook.md#TracestoreIngesterReplayErrors"
    "expr": |
      sum by (cluster, namespace, tenant) (increase(tracestore_ingester_replay_errors_total{namespace=~".*"}[5m])) > 0
    "for": "5m"
    "labels":
      "severity": "critical"
