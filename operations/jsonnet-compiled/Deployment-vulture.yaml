apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulture
  namespace: tracing
spec:
  minReadySeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vulture
      name: vulture
  template:
    metadata:
      labels:
        app: vulture
        name: vulture
    spec:
      containers:
      - args:
        - -prometheus-listen-address=:8080
        - -tracestore-push-url=http://distributor
        - -tracestore-query-url=http://query-frontend:3200/tracestore
        - -tracestore-org-id=1
        - -tracestore-retention-duration=336h
        - -tracestore-search-backoff-duration=5s
        - -tracestore-read-backoff-duration=10s
        - -tracestore-write-backoff-duration=10s
        image: acme/tracestore-vulture:latest
        imagePullPolicy: IfNotPresent
        name: vulture
        ports:
        - containerPort: 8080
          name: prom-metrics
        resources:
          limits:
            cpu: 100m
            memory: 500Mi
          requests:
            cpu: 50m
            memory: 100Mi
