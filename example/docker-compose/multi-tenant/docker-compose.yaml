services:

  # Tracestore runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tracestore to start correctly.
  init:
    image: &tracestoreImage acme/tracestore:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tracestore"
    volumes:
      - ./tracestore-data:/var/tracestore

  tracestore:
    image: *tracestoreImage
    command: [ "-config.file=/etc/tracestore.yaml" ]
    environment:
      - GRPC_TRACE=api
    volumes:
      - ./tracestore.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/var/tracestore
    ports:
      - "14268:14268"  # jaeger ingest
      - "3200:3200"   # tracestore
      - "9095:9095" # tracestore grpc
      - "4317:4317"  # otlp grpc
      - "4318:4318"  # otlp http
      - "9411:9411"   # zipkin
    depends_on:
      - init

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.5
    environment:
      - ENDPOINT=tracestore:4317
      - TRACESTORE_X_SCOPE_ORGID=test
    restart: always
    depends_on:
      - tracestore

  k6-tracing-2:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.5
    environment:
      - ENDPOINT=tracestore:4317
      - TRACESTORE_X_SCOPE_ORGID=test2
    restart: always
    depends_on:
      - tracestore

  acme:
    image: acme/acme:11.2.0
    volumes:
      - ./acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_DEFAULT_APP_MODE=development
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
    ports:
      - "3000:3000"
