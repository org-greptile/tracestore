services:

  # Tracestore runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tracestore to start correctly.
  init:
    image: &tracestoreImage acme/tracestore:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tracestore"
    volumes:
      - ./tracestore-data:/var/tracestore

  tracestore:
    image: *tracestoreImage
    command: [ "-config.file=/etc/tracestore.yaml" ]
    volumes:
      - ../shared/tracestore.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/var/tracestore
    ports:
      - "3200" # tracestore
      - "4317" # otlp grpc
    depends_on:
      - init

  # Generate fake traces...
  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.5
    environment:
      - ENDPOINT=otel-collector:4317
    restart: always
    depends_on:
      - otel-collector

  # And put them in an OTEL collector pipeline...
  otel-collector:
    image: otel/opentelemetry-collector:0.86.0
    command: [ "--config=/etc/otel-collector.yaml" ]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ../shared/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:11.0.0
    volumes:
      - ../shared/acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
