services:

  # Tracestore runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tracestore to start correctly.
  init:
    image: &tracestoreImage acme/tracestore:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tracestore"
    volumes:
      - ./tracestore-data:/var/tracestore

  tracestore:
    image: *tracestoreImage
    command: [ "-config.file=/etc/tracestore.yaml" ]
    volumes:
      - ../shared/tracestore.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/var/tracestore
    ports:
      - "14268"  # jaeger ingest
      - "3200"   # tracestore
      - "4317"  # otlp grpc
      - "4318"  # otlp http
      - "9411"   # zipkin2024-04-23T16:16:57+0000
    depends_on:
      - init

  # Generate fake traces...
  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.5
    environment:
      - ENDPOINT=alloy:4317
    restart: always
    depends_on:
      - tracestore
      - alloy

  # And put them in a Acme Alloy pipeline...
  alloy:
    image: acme/alloy:v1.3.1
    volumes:
      - ../shared/config.alloy:/etc/alloy/config.alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
      - "4319:4319"
    depends_on:
      - tracestore

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ../shared/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:11.2.0
    volumes:
      - ../shared/acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
