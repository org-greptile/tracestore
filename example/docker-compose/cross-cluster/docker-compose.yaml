services:

  # tracestore - a
  distributor-a:
    image: &tracestoreImage acme/tracestore:latest
    command: "-target=distributor -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-0-a:
    image: *tracestoreImage
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-1-a:
    image: *tracestoreImage
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-2-a:
    image: *tracestoreImage
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  query-frontend-a:
    image: *tracestoreImage
    command: "-target=query-frontend -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  querier-a:
    image: *tracestoreImage
    command: "-target=querier -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  compactor-a:
    image: *tracestoreImage
    command: "-target=compactor -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  metrics-generator-a:
    image: *tracestoreImage
    command: "-target=metrics-generator -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-a.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  # tracestore - b
  #  there is purposefully no compactor-b. only one cell can compactor or there will be job collisions
  distributor-b:
    image: *tracestoreImage
    command: "-target=distributor -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-0-b:
    image: *tracestoreImage
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-1-b:
    image: *tracestoreImage
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-2-b:
    image: *tracestoreImage
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  query-frontend-b:
    image: *tracestoreImage
    command: "-target=query-frontend -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  querier-b:
    image: *tracestoreImage
    command: "-target=querier -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  metrics-generator-b:
    image: *tracestoreImage
    command: "-target=metrics-generator -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed-b.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ACCESS_KEY=tracestore
      - MINIO_SECRET_KEY=supersecret
    ports:
      - "9001:9001"
    entrypoint:
      - sh
      - -euc
      - mkdir -p /data/tracestore && minio server /data --console-address ':9001'

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.5
    environment:
      - ENDPOINT=distributor-a:4317
    restart: always
    depends_on:
      - distributor-a

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:11.0.0
    volumes:
      - ./acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
