version: "3"
services:

  tracestore:
    image: acme/tracestore:latest
    command: [ "-config.file=/etc/tracestore.yaml" ]
    volumes:
      - ./tracestore-s3.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/tmp/tracestore
    ports:
      - "14268"      # jaeger
      - "3200:3200"  # tracestore
    restart: on-failure
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ACCESS_KEY=tracestore
      - MINIO_SECRET_KEY=supersecret
    ports:
      - "9001:9001"
    entrypoint:
      - sh
      - -euc
      - mkdir -p /data/tracestore && /opt/bin/minio server /data --console-address ':9001'

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.2
    environment:
      - ENDPOINT=tracestore:4317
    restart: always
    depends_on:
      - tracestore

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../shared/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:9.4.3
    volumes:
      - ../shared/acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
