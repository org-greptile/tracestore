services:

   # Tracestore runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tracestore to start correctly.
  init:
    image: &tracestoreImage acme/tracestore:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tracestore"
    volumes:
      - ./tracestore-data:/var/tracestore

  tracestore:
    image: *tracestoreImage
    command: [ "-config.file=/etc/tracestore.yaml" ]
    volumes:
      - ../shared/tracestore.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/var/tracestore
    ports:
      - "3200:3200"   # tracestore
      - "14250:14250"  # jaeger ingest grpc
    depends_on:
      - init

  vulture:
    image: acme/tracestore-vulture:latest
    command: [ "-tracestore-query-url=http://tracestore:3200", "-tracestore-push-url=http://tracestore:14250" ]
    depends_on:
      - tracestore