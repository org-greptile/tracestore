version: "3"
services:

  distributor:
    image: acme/tracestore:latest
    command: "-target=distributor -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-0:
    image: acme/tracestore:latest
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-1:
    image: acme/tracestore:latest
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  ingester-2:
    image: acme/tracestore:latest
    command: "-target=ingester -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  query-frontend:
    image: acme/tracestore:latest
    command: "-target=query-frontend -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200:3200"   # tracestore

  querier:
    image: acme/tracestore:latest
    command: "-target=querier -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  compactor:
    image: acme/tracestore:latest
    command: "-target=compactor -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  metrics-generator:
    image: acme/tracestore:latest
    command: "-target=metrics-generator -config.file=/etc/tracestore.yaml"
    restart: always
    volumes:
      - ./tracestore-distributed.yaml:/etc/tracestore.yaml
    ports:
      - "3200"   # tracestore

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ACCESS_KEY=tracestore
      - MINIO_SECRET_KEY=supersecret
    ports:
      - "9001:9001"
    entrypoint:
      - sh
      - -euc
      - mkdir -p /data/tracestore && minio server /data --console-address ':9001'

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.2
    environment:
      - ENDPOINT=distributor:4317
    restart: always
    depends_on:
      - distributor

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:9.4.3
    volumes:
      - ./acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
