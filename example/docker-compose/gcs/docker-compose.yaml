version: "3"
services:

  tracestore:
    image: acme/tracestore:latest
    command: [ "-config.file=/etc/tracestore.yaml" ]
    volumes:
      - ./tracestore-gcs.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/tmp/tracestore
    ports:
      - "14268"      # jaeger
      - "3200:3200"  # tracestore
    depends_on:
      - gcs

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: [ "-public-host=gcs -port=4443"]
    ports:
      - "4443:4443"
    volumes:
      # This creates an empty tracestore bucket
      - ./gcs-data/:/data/tracestore/

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.2
    environment:
      - ENDPOINT=tracestore:4317
    restart: always
    depends_on:
      - tracestore

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../shared/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:9.4.3
    volumes:
      - ../shared/acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
