version: "3"
services:

  tracestore:
    image: acme/tracestore:latest
    command: [ "-config.file=/etc/tracestore.yaml" ]
    restart: always
    volumes:
      - ./tracestore-azure.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/tmp/tracestore
    ports:
      - "14268"      # jaeger
      - "3200:3200"  # tracestore
    depends_on:
      - azure-cli
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - 10000:10000

  # Creates the Azure storage container
  azure-cli:
    image: mcr.microsoft.com/azure-cli:2.9.1
    command: [ "az", "storage","container", "create", "-n","tracestore", "--connection-string","DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;" ]
    depends_on:
      - azurite

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.2
    environment:
      - ENDPOINT=tracestore:4317
    restart: always
    depends_on:
      - tracestore

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../shared/prometheus.yaml:/etc/prometheus.yaml
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:9.4.3
    volumes:
      - ../shared/acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
