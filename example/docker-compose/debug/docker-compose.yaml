version: "3"
services:

  tracestore:
    image: acme/tracestore-debug:latest
    command: [ "-config.file=/etc/tracestore.yaml" ]
    volumes:
      - ../shared/tracestore.yaml:/etc/tracestore.yaml
      - ./tracestore-data:/tmp/tracestore
    environment:
      - DEBUG_BLOCK=0
    ports:
      - "14268:14268" # jaeger ingest
      - "3200:3200"   # tracestore
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
      - "9411:9411"   # zipkin
      - "2345:2345"   # delve debug server

  k6-tracing:
    image: ghcr.io/acme/xk6-client-tracing:v0.0.2
    environment:
      - ENDPOINT=tracestore:4317
    restart: always
    depends_on:
      - tracestore

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../shared/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  acme:
    image: acme/acme:9.4.3
    volumes:
      - ../shared/acme-datasources.yaml:/etc/acme/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
