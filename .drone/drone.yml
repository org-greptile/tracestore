---
depends_on: []
kind: pipeline
name: docker-amd64
platform:
  arch: amd64
  os: linux
steps:
- commands:
  - apk --update --no-cache add bash
  - git fetch origin --tags
  - echo $(./tools/image-tag)-amd64 > .tags
  image: alpine/git:v2.30.2
  name: image-tag
- commands:
  - apk --update --no-cache add make git bash
  - COMPONENT=tracestore GOARCH=amd64 make exe
  - COMPONENT=tracestore-vulture GOARCH=amd64 make exe
  - COMPONENT=tracestore-query GOARCH=amd64 make exe
  image: golang:1.20.4-alpine
  name: build-tracestore-binaries
- image: plugins/docker
  name: build-tracestore-image
  settings:
    build_args:
    - TARGETARCH=amd64
    dockerfile: cmd/tracestore/Dockerfile
    password:
      from_secret: docker_password
    repo: acme/tracestore
    username:
      from_secret: docker_username
- image: plugins/docker
  name: build-tracestore-vulture-image
  settings:
    build_args:
    - TARGETARCH=amd64
    dockerfile: cmd/tracestore-vulture/Dockerfile
    password:
      from_secret: docker_password
    repo: acme/tracestore-vulture
    username:
      from_secret: docker_username
- image: plugins/docker
  name: build-tracestore-query-image
  settings:
    build_args:
    - TARGETARCH=amd64
    dockerfile: cmd/tracestore-query/Dockerfile
    password:
      from_secret: docker_password
    repo: acme/tracestore-query
    username:
      from_secret: docker_username
trigger:
  ref:
  - refs/heads/main
  - refs/tags/v*
  - refs/heads/r?
  - refs/heads/r??
