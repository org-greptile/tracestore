- docker-amd64
- docker-arm64
kind: pipeline
name: manifest
platform:
  arch: amd64
  os: linux
steps:
- commands:
  - apk --update --no-cache add bash
  - git fetch origin --tags
  - echo $(./tools/image-tag) > .tags
  image: alpine/git:v2.30.2
  name: image-tag
- image: plugins/manifest:1.4.0
  name: manifest-tracestore
  settings:
    password:
      from_secret: docker_password
    spec: .drone/docker-manifest.tmpl
    target: tracestore
    username:
      from_secret: docker_username
- image: plugins/manifest:1.4.0
  name: manifest-tracestore-vulture
  settings:
    password:
      from_secret: docker_password
    spec: .drone/docker-manifest.tmpl
    target: tracestore-vulture
    username:
      from_secret: docker_username
- image: plugins/manifest:1.4.0
  name: manifest-tracestore-query
  settings:
    password:
      from_secret: docker_password
    spec: .drone/docker-manifest.tmpl
    target: tracestore-query
    username:
      from_secret: docker_username
trigger:
  ref:
  - refs/heads/main
  - refs/tags/v*
  - refs/heads/r?
  - refs/heads/r??
---
depends_on:
- manifest
image_pull_secrets:
- dockerconfigjson
kind: pipeline
name: cd-to-dev-env
platform:
  arch: amd64
  os: linux
steps:
- commands:
  - apk --update --no-cache add bash
  - git fetch origin --tags
  - echo "acme/tracestore:$(./tools/image-tag)" > .tags-for-cd-tracestore
  - echo "acme/tracestore-query:$(./tools/image-tag)" > .tags-for-cd-tracestore_query
  - echo "acme/tracestore-vulture:$(./tools/image-tag)" > .tags-for-cd-tracestore_vulture
  image: alpine/git:v2.30.2
  name: image-tag-for-cd
- image: us.gcr.io/kubernetes-dev/drone/plugins/updater
  name: update-dev-images
  settings:
    config_json: |-
      {
        "destination_branch": "master",
        "pull_request_branch_prefix": "cd-tracestore-dev",
        "pull_request_enabled": false,
        "pull_request_team_reviewers": [
          "tracestore"
        ],
        "repo_name": "deployment_tools",
        "update_jsonnet_attribute_configs": [
          {
            "file_path": "ksonnet/environments/tracestore/dev-us-central-0.tracestore-dev-01/images.libsonnet",
            "jsonnet_key": "tracestore",
            "jsonnet_value_file": ".tags-for-cd-tracestore"
          },
          {
            "file_path": "ksonnet/environments/tracestore/dev-us-central-0.tracestore-dev-01/images.libsonnet",
            "jsonnet_key": "tracestore_query",
            "jsonnet_value_file": ".tags-for-cd-tracestore_query"
          },
          {
            "file_path": "ksonnet/environments/tracestore/dev-us-central-0.tracestore-dev-01/images.libsonnet",
            "jsonnet_key": "tracestore_vulture",
            "jsonnet_value_file": ".tags-for-cd-tracestore_vulture"
          }
        ]
      }
    github_token:
      from_secret: gh_token
trigger:
  ref:
  - refs/heads/main
---
depends_on: []
kind: pipeline
name: build-deploy-serverless
platform:
  arch: amd64
  os: linux
steps:
- commands:
  - apk add make git zip bash
  - ./tools/image-tag | cut -d, -f 1 | tr A-Z a-z > .tags
  - cd ./cmd/tracestore-serverless
  - make build-docker-gcr-binary
  - make build-lambda-zip
  image: golang:1.20.4-alpine
  name: build-tracestore-serverless
- image: plugins/gcr
  name: deploy-tracestore-serverless-gcr
  settings:
    context: ./cmd/tracestore-serverless/cloud-run
    dockerfile: ./cmd/tracestore-serverless/cloud-run/Dockerfile
    json_key:
      from_secret: ops_tools_img_upload
    repo: ops-tools-1203/tracestore-serverless
- commands:
  - cd ./cmd/tracestore-serverless/lambda
  - aws s3 cp tracestore-serverless*.zip s3://dev-tracestore-fn-source
  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID-dev
    AWS_DEFAULT_REGION: us-east-2
    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY-dev
  image: amazon/aws-cli
  name: deploy-tracestore-dev-serverless-lambda
- commands:
  - cd ./cmd/tracestore-serverless/lambda
  - aws s3 cp tracestore-serverless*.zip s3://prod-tracestore-fn-source
  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID-prod
    AWS_DEFAULT_REGION: us-east-2
    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY-prod
  image: amazon/aws-cli
  name: deploy-tracestore-prod-serverless-lambda
trigger:
  ref:
  - refs/heads/main
  - refs/tags/v*
  - refs/heads/r?
  - refs/heads/r??
---
depends_on: []
kind: pipeline
name: release
platform:
  arch: amd64
  os: linux
services:
- image: jrei/systemd-debian:12
  name: systemd-debian
  privileged: true
  volumes:
  - name: cgroup
    path: /sys/fs/cgroup
- image: jrei/systemd-centos:8
  name: systemd-centos
  privileged: true
  volumes:
  - name: cgroup
    path: /sys/fs/cgroup
steps:
- commands:
  - git fetch --tags
  image: docker:git
  name: fetch
- commands:
  - printf "%s" "$NFPM_SIGNING_KEY" > $NFPM_SIGNING_KEY_FILE
  environment:
    NFPM_SIGNING_KEY:
      from_secret: gpg_private_key
    NFPM_SIGNING_KEY_FILE: /drone/src/private-key.key
  image: golang:1.20.4
  name: write-key
- commands:
  - make release-snapshot
  environment:
    NFPM_DEFAULT_PASSPHRASE:
      from_secret: gpg_passphrase
    NFPM_SIGNING_KEY_FILE: /drone/src/private-key.key
  image: golang:1.20.4
  name: test release
- commands:
  - ./tools/packaging/verify-deb-install.sh
  image: docker
  name: test deb package
  privileged: true
  volumes:
  - name: docker
    path: /var/run/docker.sock
- commands:
  - ./tools/packaging/verify-rpm-install.sh
  image: docker
  name: test rpm package
  privileged: true
  volumes:
  - name: docker
    path: /var/run/docker.sock
- commands:
  - make release
  environment:
    GITHUB_TOKEN:
      from_secret: gh_token
    NFPM_DEFAULT_PASSPHRASE:
      from_secret: gpg_passphrase
    NFPM_SIGNING_KEY_FILE: /drone/src/private-key.key
  image: golang:1.20.4
  name: release
  when:
    event:
    - tag
trigger:
  event:
  - tag
  - pull_request
volumes:
- host:
    path: /sys/fs/cgroup
  name: cgroup
- host:
    path: /var/run/docker.sock
  name: docker
